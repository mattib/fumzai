<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: system-ui; width: 250px; padding: 15px; margin: 0; background: #1a1a1a; color: #fff; }
    h2 { margin: 0 0 15px 0; font-size: 16px; display: flex; align-items: center; justify-content: space-between; }
    .toggle { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
    .toggle label { margin: 0; color: #fff; font-size: 14px; }
    .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #555; transition: .4s; border-radius: 20px; }
    .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: #10a37f; }
    input:checked + .slider:before { transform: translateX(20px); }
    a { color: #10a37f; text-decoration: none; font-size: 13px; display: block; text-align: center; margin-top: 10px; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h2>💤 FumzAI 
    <label class="switch">
      <input type="checkbox" id="enabled" checked>
      <span class="slider"></span>
    </label>
  </h2>
  
  <div style="font-size: 12px; color: #aaa; text-align: center; margin-bottom: 15px;" id="status-text">
    Curfew is Active
  </div>

  <a href="#" id="open-options">⚙️ Open Full Settings</a>

  <script src="popup.js"></script>
</body>
</html>
