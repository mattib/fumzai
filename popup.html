<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FumzAI</title>
  <style>
    body { font-family: -apple-system, system-ui; width: 300px; padding: 15px; margin: 0; background: #1a1a1a; color: #fff; }
    h2 { margin: 0 0 15px 0; font-size: 18px; display: flex; align-items: center; gap: 8px; }
    .row { margin-bottom: 12px; }
    label { display: block; font-size: 13px; margin-bottom: 4px; color: #aaa; }
    input[type="time"], select { width: 100%; padding: 8px; background: #333; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
    .toggle { display: flex; align-items: center; justify-content: space-between; }
    .toggle label { margin: 0; color: #fff; font-size: 15px; }
    
    /* Toggle switch CSS */
    .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #555; transition: .4s; border-radius: 20px; }
    .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: #10a37f; }
    input:checked + .slider:before { transform: translateX(20px); }
  </style>
</head>
<body>
  <h2>💤 FumzAI Settings</h2>
  
  <div class="row toggle">
    <label for="enabled">Enable Curfew</label>
    <label class="switch">
      <input type="checkbox" id="enabled" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="row">
    <label for="start">Curfew Start Time</label>
    <input type="time" id="start" value="23:00">
  </div>

  <div class="row">
    <label for="end">Curfew End Time</label>
    <input type="time" id="end" value="05:00">
  </div>

  <div class="row">
    <label for="personality">Bouncer Personality</label>
    <select id="personality">
      <option value="strict">Strict Drill Sergeant</option>
      <option value="gentle">Gentle Parent</option>
      <option value="philosopher">Philosopher</option>
    </select>
  </div>

  <script src="popup.js"></script>
</body>
</html>
